server:
  port: 8000
#  address: 26.185.15.150

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  info:
    env:
      enabled: true

# Показується на http://localhost:8000/actuator/info — зручно перевіряти, що нова версія задеплоїлась
info:
  app:
    name: BookBarter API Gateway
    version: 1.0.0

jwt:
  secret: sheeesh
  accessToken:
    lifetime: 1h
  refreshToken:
    lifetime: 1d

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
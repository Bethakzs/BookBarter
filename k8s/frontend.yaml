# Фронтенд BookBarter (React + Vite, submodule bookbarter-front, образ із frontend/Dockerfile).
# Пайплайн застосовує цей маніфест, якщо в репозиторії є bookbarter-front/package.json.
# У браузері: k8s/port-forward.ps1 -> http://localhost:4173 (API — http://localhost:8000)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bookbarter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: bethakzs/bookbarter-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bookbarter
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
  type: NodePort

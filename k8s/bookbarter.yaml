apiVersion: batch/v1
kind: Job
metadata:
  name: book-seed
  namespace: bookbarter
spec:
  template:
    metadata:
      labels:
        app: book-seed
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-book-service
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - >-
              echo "Waiting for book-service to be ready...";
              until nc -z book-service 8083; do
                echo "book-service is not ready yet. Waiting...";
                sleep 5;
              done;
              echo "Waiting extra time for service initialization...";
              sleep 10;
              echo "book-service is ready!";
        - name: wait-for-schema
          image: postgres:16
          env:
            - name: PGPASSWORD
              value: "12345"
          command: ["/bin/bash","-c"]
          args:
            - >-
              echo "Waiting for database and schema...";
              until pg_isready -h book-db -p 5432 -U postgres -d book; do
                echo "Database not ready. Waiting...";
                sleep 2;
              done;
              until psql -h book-db -U postgres -d book -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='books'" | grep -q 1; do
                echo "Schema not created yet. Waiting...";
                sleep 3;
              done;
              echo "Database and schema are ready!";
      containers:
        - name: seed
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              value: "12345"
          volumeMounts:
            - name: seed-sql
              mountPath: /seed
          command: ["/bin/bash","-c"]
          args:
            - >-
              echo "Starting data seeding...";
              psql -h book-db -U postgres -d book -f /seed/book_data_insert.sql;
              echo "Data seeding completed!";
      volumes:
        - name: seed-sql
          configMap:
            name: book-seed-sql
            items:
              - key: book_data_insert.sql
                path: book_data_insert.sql
---

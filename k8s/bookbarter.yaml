apiVersion: v1
kind: ConfigMap
metadata:
  name: book-seed-sql
  namespace: bookbarter
data:
  book_data_insert.sql: |
    TRUNCATE TABLE books CASCADE;
    ALTER SEQUENCE books_id_seq RESTART WITH 1;

    INSERT INTO books (title, image, description, author, year, published_by, price, status, user_email)
    VALUES ('The Lord of the Rings', NULL, 'Epic fantasy adventure', 'J.R.R. Tolkien', 1954, 'Allen & Unwin', 10, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('Dune', NULL, 'Science fiction masterpiece', 'Frank Herbert', 1965, 'Chilton Books', 9, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('The Hobbit', NULL, 'Prequel to LOTR', 'J.R.R. Tolkien', 1937, 'Allen & Unwin', 3, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('1984', NULL, 'Dystopian classic', 'George Orwell', 1949, 'Secker & Warburg', 13, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('To Kill a Mockingbird', NULL, 'Story of racial injustice', 'Harper Lee', 1960, 'J.B. Lippincott', 10, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('The Da Vinci Code', NULL, 'Religious conspiracy thriller', 'Dan Brown', 2003, 'Doubleday', 8, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('Pride and Prejudice', NULL, 'Romance and manners', 'Jane Austen', 1813, 'T. Egerton', 9, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('The Martian', NULL, 'Survival on Mars', 'Andy Weir', 2011, 'Crown', 2, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('The Shining', NULL, 'Haunted hotel horror', 'Stephen King', 1977, 'Doubleday', 20, 'AVAILABLE', 'romanwdwd@gmail.com'),
           ('Harry Potter and the Philosopher''s Stone', NULL, 'Wizarding world debut', 'J.K. Rowling', 1997, 'Bloomsbury', 30, 'AVAILABLE', 'romanwdwd@gmail.com');

    TRUNCATE TABLE book_genre;

    INSERT INTO book_genre (book_id, genre)
    VALUES (1, 'Fantasy'),
           (2, 'Fiction'),
           (3, 'Children'),
           (4, 'Fiction'),
           (5, 'Fiction'),
           (6, 'Fantasy'),
           (7, 'Historical'),
           (8, 'Novel'),
           (9, 'Fiction'),
           (10, 'Fantasy');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: bookbarter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.4
          imagePullPolicy: IfNotPresent
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          ports:
            - containerPort: 2181
              name: client
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: bookbarter
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: bookbarter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:5.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "20971520"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bookbarter
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: bookbarter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: "12345"
            - name: POSTGRES_DB
              value: user
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["bash","-c","pg_isready -U postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["bash","-c","pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1

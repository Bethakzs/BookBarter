---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: bookbarter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: bethakzs/bookbarter-notification-service:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
          env:
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://notification-db:5432/notification
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookbarter-secrets
                  key: db-password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka:8761/eureka/
            - name: SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookbarter-secrets
                  key: jwt-secret
            - name: JWT_ACCESS_TOKEN_LIFETIME
              value: 1h
            - name: JWT_REFRESH_TOKEN_LIFETIME
              value: 1d
          ports:
            - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: bookbarter
spec:
  selector:
    app: notification-service
  ports:
    - port: 8088
      targetPort: 8088
---

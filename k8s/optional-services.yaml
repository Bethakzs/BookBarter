# Додаткові (не критичні) сервіси BookBarter: notification, review, email (Go).
# За замовчуванням пайплайн їх НЕ розгортає, щоб заощадити пам'ять локального стенду.
# Увімкнути: параметр FULL_STACK=true у Jenkins або вручну  kubectl apply -f k8s/optional-services.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: bookbarter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-db
  template:
    metadata:
      labels:
        app: notification-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookbarter-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: notification
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["bash","-c","pg_isready -U postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["bash","-c","pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: bookbarter
spec:
  selector:
    app: notification-db
  ports:
    - port: 5432
      targetPort: 5432
---
